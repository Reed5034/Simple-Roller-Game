<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROLLER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>ROLLER</h1>

  <canvas id="game" width="800" height="400"></canvas>

  <div id="admin-bar" class="admin-bar hidden">
    <label for="admin-code">Admin code</label>
    <input id="admin-code" type="text" maxlength="16" placeholder="ENTER CODE" aria-label="Admin code">
    <button id="unlock-aura" type="button">Unlock Aura</button>
  </div>

  <p id="message">Loading...</p>

  <p class="controls">
    LEFT / RIGHT arrow to roll &nbsp;&middot;&nbsp;
    SPACE or UP arrow to jump &nbsp;&middot;&nbsp;
    X to shoot as Gold &nbsp;&middot;&nbsp;
    T to teleport as Violet &nbsp;&middot;&nbsp;
    R to restart
  </p>

  <!-- ===================================================================
       THE ORDER OF THESE FILES MATTERS. Each one uses the ones above it.
       If you add a new file, add it to this list too, in the right spot.
       =================================================================== -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/collide.js"></script>
  <script src="js/player.js"></script>
  <script src="js/enemy.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
